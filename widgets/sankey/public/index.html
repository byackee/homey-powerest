<!--
  Widget « Flux d'énergie » — compteur général → pièces → appareils.

  Le nombre que ce diagramme existe pour montrer n'est pas la consommation d'une lampe : c'est
  l'écart entre ce que le compteur voit et ce que les appareils expliquent. Sur un logement réel,
  428 W au Linky contre 173 W identifiés. Une liste d'appareils ne montre jamais ce trou.
-->
<script type="text/javascript" src="/homey.js" data-origin="widget"></script>
<style>
  .viz {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #8a8983;
    --unknown: #b9b8b1;      /* le non mesuré n'est pas une catégorie : il est neutre */
    --hairline: #e6e5e0;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8a8983;
      --unknown: #6b6a64;
      --hairline: #2e2e2b;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --s4: #c98500; --s5: #d55181; --s6: #008300;
    }
  }
  :root[data-theme="dark"] .viz {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8a8983;
    --unknown: #6b6a64;
    --hairline: #2e2e2b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --s4: #c98500; --s5: #d55181; --s6: #008300;
  }

  html, body { margin: 0; padding: 0; }
  .viz {
    background: var(--surface-1); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%; box-sizing: border-box; padding: 10px 12px 6px;
    display: flex; flex-direction: column; position: relative;
  }
  .head { display: flex; gap: 16px; align-items: baseline; margin-bottom: 2px; }
  .hero { font-size: 24px; font-weight: 650; letter-spacing: -0.4px; line-height: 1; }
  .hero .u { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }
  .sub { font-size: 11px; color: var(--text-secondary); }
  .sub b { color: var(--text-primary); font-weight: 600; }
  svg { flex: 1; width: 100%; display: block; }
  .nname { font-size: 11px; font-weight: 600; fill: var(--text-primary); }
  .nval  { font-size: 10px; fill: var(--text-secondary); }
  .nname.dim, .nval.dim { fill: var(--text-secondary); }
  .box { stroke: var(--surface-1); stroke-width: 1.5; }
  .edge { stroke: none; }
  .ribbon { opacity: .3; }
  .ribbon:hover { opacity: .6; }
  .box:hover { filter: brightness(.97); }
  .empty { font-size: 12px; color: var(--text-secondary); padding: 20px 4px; }
  #tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--text-primary); color: var(--surface-1);
    font-size: 11px; padding: 4px 7px; border-radius: 5px; white-space: nowrap; z-index: 5;
  }
</style>

<div class="viz" id="viz">
  <div class="head">
    <div class="hero" id="hero">—<span class="u">W</span></div>
    <div class="sub" id="sub"></div>
  </div>
  <svg id="svg" preserveAspectRatio="none"></svg>
  <div id="tip"></div>
</div>

<script type="text/javascript">
  function onHomeyReady(Homey) {
    'use strict';

    var W = 1000, X_SRC = 3, W_SRC = 128, X_ZONE = 302, W_ZONE = 208, X_DEV = 698, X_END = 994, GAP_ZONE = 4, GAP_DEV = 3;
    var SLOTS = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6'];
    var svg = document.getElementById('svg');
    var tip = document.getElementById('tip');

    function el(tag, attrs) {
      var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    }
    function fmt(w) { return w >= 100 ? Math.round(w) : w >= 10 ? w.toFixed(1) : w.toFixed(2); }
    function cut(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }

    function hover(node, text) {
      node.addEventListener('mousemove', function (e) {
        tip.textContent = text;
        tip.style.opacity = 1;
        var r = document.getElementById('viz').getBoundingClientRect();
        tip.style.left = Math.min(e.clientX - r.left + 10, r.width - tip.offsetWidth - 6) + 'px';
        tip.style.top = (e.clientY - r.top - 26) + 'px';
      });
      node.addEventListener('mouseleave', function () { tip.style.opacity = 0; });
    }

    /** Ruban à épaisseur constante entre deux bords verticaux. */
    function ribbon(x0, y0a, y0b, x1, y1a, y1b, fill, title) {
      var c = (x0 + x1) / 2;
      var d = 'M' + x0 + ',' + y0a
            + 'C' + c + ',' + y0a + ' ' + c + ',' + y1a + ' ' + x1 + ',' + y1a
            + 'L' + x1 + ',' + y1b
            + 'C' + c + ',' + y1b + ' ' + c + ',' + y0b + ' ' + x0 + ',' + y0b + 'Z';
      var p = el('path', { d: d, fill: fill, class: 'ribbon' });
      hover(p, title);
      return p;
    }

    /**
     * Hachure des branches sans détail.
     *
     * Le non mesuré n'est pas une catégorie de plus : c'est l'absence d'information. Une texture
     * le dit sans couleur, ce qui le distingue aussi pour qui ne perçoit pas les teintes.
     */
    function hatch(color) {
      var defs = el('defs', {});
      var pat = el('pattern', { id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
      pat.appendChild(el('rect', { width: 6, height: 6, fill: color, 'fill-opacity': .18 }));
      pat.appendChild(el('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: color, 'stroke-width': 2.4, 'stroke-opacity': .5 }));
      defs.appendChild(pat);
      return defs;
    }

    /**
     * Un nœud est une BOÎTE qui porte son nom et sa valeur, comme dans les cartes Sankey de Home
     * Assistant — et non une barre fine avec l'étiquette à côté.
     *
     * Une différence assumée avec le look d'origine : là-bas le texte est blanc sur un aplat de
     * couleur. Trois teintes de notre palette validée n'ont pas le contraste nécessaire pour ça
     * (aqua 2,7:1, jaune 2,1:1, magenta 2,6:1 sur fond clair). La boîte est donc un aplat CLAIR de
     * la teinte avec un liseré plein : même lecture, même identité, sans texte illisible.
     */
    function nodeBox(x, y, w, h, color, name, watts, pct, dim, hatched) {
      var g = el('g', {});
      g.appendChild(el('rect', {
        x: x, y: y, width: w, height: h, rx: 4,
        fill: hatched ? 'url(#hatch)' : color, 'fill-opacity': hatched ? 1 : .17, class: 'box',
      }));
      // Liseré : il porte la couleur pleine, donc l'identité, sans être sous le texte.
      g.appendChild(el('rect', { x: x, y: y, width: 3.5, height: h, rx: 1.75, fill: color, class: 'edge' }));

      var pad = 9;
      if (h >= 23) {
        var t1 = el('text', { x: x + pad, y: y + h / 2 - 3, class: 'nname' + (dim ? ' dim' : '') });
        t1.textContent = cut(name, Math.floor((w - pad * 2) / 6));
        g.appendChild(t1);
        var t2 = el('text', { x: x + pad, y: y + h / 2 + 10, class: 'nval' });
        t2.textContent = fmt(watts) + ' W' + (pct !== null ? '  ·  ' + pct + '%' : '');
        g.appendChild(t2);
      } else if (h >= 10) {
        var t = el('text', { x: x + pad, y: y + h / 2 + 3.5, class: 'nname' + (dim ? ' dim' : '') });
        t.textContent = cut(name, Math.floor((w - pad * 2) / 6.4)) + '   ' + fmt(watts) + ' W';
        g.appendChild(t);
      }
      return g;
    }

    /** Dégradé d'un ruban : il part de la couleur de la source et arrive à celle de la cible. */
    function gradient(id, from, to) {
      var g = el('linearGradient', { id: id, x1: '0', x2: '1', y1: '0', y2: '0' });
      g.appendChild(el('stop', { offset: '0', 'stop-color': from }));
      g.appendChild(el('stop', { offset: '1', 'stop-color': to }));
      return g;
    }

    function render(m) {
      svg.innerHTML = '';
      var H = Math.max(160, svg.clientHeight || 300);
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

      var zones = m.nodes.filter(function (n) { return n.depth === 1; });
      if (!m.total || !zones.length) {
        document.getElementById('sub').textContent = 'Aucun appareil ne mesure de puissance.';
        return;
      }

      var css = getComputedStyle(document.getElementById('viz'));
      var defs = hatch(css.getPropertyValue('--unknown').trim());
      svg.appendChild(defs);

      var usable = H - 6 - (zones.length - 1) * GAP_ZONE;
      var scale = usable / m.total;
      var srcColor = css.getPropertyValue('--text-secondary').trim();

      var slot = 0, ySrc = 3, yZone = 3, gid = 0;
      var srcNode = m.nodes.filter(function (n) { return n.depth === 0; })[0];

      zones.forEach(function (z) {
        var isUnknown = z.id.indexOf('__unmeasured__') >= 0;
        var isTiny = z.id.indexOf('__tiny__') >= 0;
        var leaf = !m.links.some(function (l) { return l.from === z.id; });
        var color = (isUnknown || isTiny)
          ? css.getPropertyValue('--unknown').trim()
          : css.getPropertyValue(SLOTS[slot++ % SLOTS.length]).trim();

        var h = Math.max(1, z.watts * scale);
        var pct = m.total ? Math.round(z.watts / m.total * 100) : 0;
        var title = z.label + ' · ' + fmt(z.watts) + ' W · ' + pct + '%';

        var gA = 'g' + (gid++);
        defs.appendChild(gradient(gA, srcColor, color));
        svg.appendChild(ribbon(X_SRC + W_SRC, ySrc, ySrc + h, X_ZONE, yZone, yZone + h, 'url(#' + gA + ')', title));

        // Une branche sans détail s'étend jusqu'au bord : le vide suggérerait un dessin manquant,
        // la hachure dit qu'il manque une donnée.
        var boxW = leaf ? (X_END - X_ZONE) : W_ZONE;
        var box = nodeBox(X_ZONE, yZone, boxW, h, color, z.label, z.watts, pct, isUnknown || isTiny, leaf);
        hover(box, title);
        svg.appendChild(box);

        var kids = m.links.filter(function (l) { return l.from === z.id; });
        if (kids.length) {
          var inner = Math.max(1, h - (kids.length - 1) * GAP_DEV);
          var dscale = inner / z.watts;
          var yz = yZone, yd = yZone;
          kids.forEach(function (l) {
            var node = m.nodes.filter(function (n) { return n.id === l.to; })[0];
            var dh = Math.max(1, l.watts * dscale);
            var dpct = z.watts ? Math.round(l.watts / z.watts * 100) : 0;
            var dtitle = (node ? node.label : '?') + ' · ' + fmt(l.watts) + ' W · ' + dpct + '% de ' + z.label;

            var gB = 'g' + (gid++);
            defs.appendChild(gradient(gB, color, color));
            svg.appendChild(ribbon(X_ZONE + W_ZONE, yz, yz + dh, X_DEV, yd, yd + dh, 'url(#' + gB + ')', dtitle));

            var dbox = nodeBox(X_DEV, yd, X_END - X_DEV, dh, color,
              node ? node.label : '?', l.watts, dpct, false, false);
            hover(dbox, dtitle);
            svg.appendChild(dbox);
            yz += dh + GAP_DEV; yd += dh + GAP_DEV;
          });
        }

        ySrc += h + GAP_ZONE;
        yZone += h + GAP_ZONE;
      });

      // Le compteur, dessiné en dernier pour couvrir les départs de rubans.
      var srcH = Math.max(1, ySrc - 3 - GAP_ZONE);
      var sbox = nodeBox(X_SRC, 3, W_SRC, srcH, srcColor,
        srcNode ? srcNode.label : 'Compteur', m.total, null, false, false);
      hover(sbox, (srcNode ? srcNode.label : 'Compteur') + ' · ' + fmt(m.total) + ' W');
      svg.appendChild(sbox);
    }

    /**
     * ⚠️ Dans un WIDGET, `Homey.api` rend une PROMESSE — contrairement à une page de réglages, où
     * elle prend un rappel en quatrième argument. Passer un rappel ici ne produit aucune erreur :
     * il n'est simplement jamais appelé, et le widget reste vide. C'est ce qui est arrivé.
     */
    function call(method, path) {
      var r;
      try { r = Homey.api(method, path, {}); }
      catch (e) { return Promise.reject(e); }
      if (r && typeof r.then === 'function') return r;
      return Promise.reject(new Error('Homey.api n’a pas rendu de promesse'));
    }

    function fail(message) {
      document.getElementById('hero').innerHTML = '—<span class="u">W</span>';
      document.getElementById('sub').textContent = String(message);
    }

    function load() {
      call('GET', '/').then(function (m) {
        if (!m) { fail('aucune donnée'); return; }
        var pct = m.total ? Math.round(m.unmeasured / m.total * 100) : 0;
        document.getElementById('hero').innerHTML = fmt(m.total) + '<span class="u">W</span>';
        document.getElementById('sub').innerHTML = m.partial
          ? 'somme des appareils — <b>aucun compteur général</b>'
          : '<b>' + fmt(m.measured) + ' W</b> identifiés · <b>' + fmt(m.unmeasured) + ' W</b> non mesurés (' + pct + '%)';
        render(m);
      }).catch(function (e) { fail((e && e.message) || e); });
    }

    // Un widget qui reste vide ne dit rien. S'il ne s'est rien passé, il doit le dire.
    setTimeout(function () {
      if (document.getElementById('sub').textContent === '') fail('pas de réponse de l’app');
    }, 4000);

    load();
    setInterval(load, 10000);
    window.addEventListener('resize', load);
    Homey.ready();
  }
</script>
