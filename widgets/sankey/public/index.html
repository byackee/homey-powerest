<!--
  Widget « Flux d'énergie » — compteur → usage → pièce → appareil.

  Le placement des nœuds est confié à `d3-sankey`. Ce n'était pas justifié tant que le diagramme
  n'avait que trois niveaux : le graphe était alors un arbre strict — un appareil, une pièce, un
  compteur — sans un seul croisement à arbitrer. Le niveau « usage » change cela : une pièce reçoit
  de plusieurs usages, un usage arrose plusieurs pièces, et l'ordre vertical des nœuds cesse d'être
  évident. C'est exactement le problème que d3-sankey résout.

  Les bibliothèques sont EMBARQUÉES et non chargées depuis un CDN : une Homey sans accès Internet
  doit continuer d'afficher son tableau de bord. Voir vendor/NOTICE.txt.
-->
<script type="text/javascript" src="/homey.js" data-origin="widget"></script>
<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-path.min.js"></script>
<script src="vendor/d3-shape.min.js"></script>
<script src="vendor/d3-sankey.min.js"></script>
<style>
  .viz {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --unknown: #b9b8b1;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz {
      color-scheme: dark;
      --surface-1: #1a1a19; --text-primary: #ffffff; --text-secondary: #c3c2b7;
      --unknown: #6b6a64;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --s4: #c98500; --s5: #d55181; --s6: #008300;
    }
  }
  :root[data-theme="dark"] .viz {
    color-scheme: dark;
    --surface-1: #1a1a19; --text-primary: #ffffff; --text-secondary: #c3c2b7;
    --unknown: #6b6a64;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --s4: #c98500; --s5: #d55181; --s6: #008300;
  }

  html, body { margin: 0; padding: 0; }
  .viz {
    background: var(--surface-1); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%; box-sizing: border-box; padding: 10px 12px 6px;
    display: flex; flex-direction: column; position: relative;
  }
  .head { display: flex; gap: 16px; align-items: baseline; margin-bottom: 2px; }
  .hero { font-size: 24px; font-weight: 650; letter-spacing: -0.4px; line-height: 1; }
  .hero .u { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }
  .sub { font-size: 11px; color: var(--text-secondary); }
  .sub b { color: var(--text-primary); font-weight: 600; }
  svg { flex: 1; width: 100%; display: block; }
  /* Le texte porte des jetons de texte, jamais la couleur de la série : trois de nos teintes
     validées n'atteignent pas le contraste d'un texte sur fond clair. Le halo le détache du ruban. */
  .lbl { font-size: 10.5px; fill: var(--text-primary);
         paint-order: stroke fill; stroke: var(--surface-1); stroke-width: 3.5px; stroke-linejoin: round; }
  .lbl .v { font-weight: 650; }
  .lbl.dim { fill: var(--text-secondary); }
  .link { fill: none; opacity: .3; }
  .link:hover { opacity: .62; }
  .node { stroke: none; }
  #tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--text-primary); color: var(--surface-1);
    font-size: 11px; padding: 4px 7px; border-radius: 5px; white-space: nowrap; z-index: 5;
  }
</style>

<div class="viz" id="viz">
  <div class="head">
    <div class="hero" id="hero">—<span class="u">W</span></div>
    <div class="sub" id="sub"></div>
  </div>
  <svg id="svg" preserveAspectRatio="none"></svg>
  <div id="tip"></div>
</div>

<script type="text/javascript">
  function onHomeyReady(Homey) {
    'use strict';

    var W = 1000, LABEL_ROOM = 206, NODE_W = 8, NODE_PAD = 7;
    var SLOTS = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6'];
    var svg = document.getElementById('svg');
    var tip = document.getElementById('tip');

    function el(tag, attrs) {
      var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    }
    function fmt(w) { return w >= 100 ? Math.round(w) : w >= 10 ? w.toFixed(1) : w.toFixed(2); }
    function cut(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }

    function hover(node, text) {
      node.addEventListener('mousemove', function (e) {
        tip.textContent = text;
        tip.style.opacity = 1;
        var r = document.getElementById('viz').getBoundingClientRect();
        tip.style.left = Math.min(e.clientX - r.left + 10, r.width - tip.offsetWidth - 6) + 'px';
        tip.style.top = (e.clientY - r.top - 26) + 'px';
      });
      node.addEventListener('mouseleave', function () { tip.style.opacity = 0; });
    }

    function render(m) {
      svg.innerHTML = '';
      var H = Math.max(160, svg.clientHeight || 320);
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      if (!m.total || m.nodes.length < 2) {
        document.getElementById('sub').textContent = 'Aucun appareil ne mesure de puissance.';
        return;
      }
      if (!window.d3 || !window.d3.sankey) {
        document.getElementById('sub').textContent = 'Bibliothèque de tracé absente';
        return;
      }

      var css = getComputedStyle(document.getElementById('viz'));
      var neutral = css.getPropertyValue('--unknown').trim();

      // Une couleur par usage, attribuée dans l'ordre de poids décroissant et jamais recyclée :
      // la couleur suit l'entité, pas son rang à l'écran.
      var catColor = {}, slot = 0;
      m.nodes.forEach(function (n) {
        if (n.depth === 1 && n.categoryId && !catColor[n.categoryId]) {
          catColor[n.categoryId] = css.getPropertyValue(SLOTS[slot++ % SLOTS.length]).trim();
        }
      });
      function colorOf(n) { return (n && n.categoryId && catColor[n.categoryId]) || neutral; }

      var index = {};
      var nodes = m.nodes.map(function (n, i) { index[n.id] = i; return Object.assign({}, n); });
      var links = m.links.map(function (l) {
        return { source: index[l.from], target: index[l.to], value: Math.max(l.watts, 0.001), categoryId: l.categoryId };
      });

      var graph;
      try {
        graph = window.d3.sankey()
          .nodeWidth(NODE_W)
          .nodePadding(NODE_PAD)
          // La marge de droite n'est pas décorative : c'est la place des étiquettes de la dernière
          // colonne, qui sinon déborderaient hors du cadre.
          .extent([[2, 4], [W - LABEL_ROOM, H - 4]])
          ({ nodes: nodes, links: links });
      } catch (e) {
        document.getElementById('sub').textContent = 'Tracé impossible : ' + (e && e.message);
        return;
      }

      var defs = el('defs', {});
      // Hachure réservée au non mesuré : ce n'est pas un usage de plus, c'est une absence. La
      // texture le dit aussi à qui ne distingue pas les couleurs.
      var pat = el('pattern', { id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
      pat.appendChild(el('rect', { width: 6, height: 6, fill: neutral, 'fill-opacity': .25 }));
      pat.appendChild(el('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: neutral, 'stroke-width': 2.4 }));
      defs.appendChild(pat);
      svg.appendChild(defs);

      var path = window.d3.sankeyLinkHorizontal();
      graph.links.forEach(function (l, i) {
        var from = colorOf(l.source), to = colorOf(l.target);
        var unknown = l.target.id && l.target.id.indexOf('__unmeasured__') >= 0;
        var stroke;
        if (unknown) {
          stroke = 'url(#hatch)';
        } else {
          var gid = 'lg' + i;
          var g = el('linearGradient', { id: gid, gradientUnits: 'userSpaceOnUse', x1: l.source.x1, x2: l.target.x0 });
          g.appendChild(el('stop', { offset: '0', 'stop-color': from }));
          g.appendChild(el('stop', { offset: '1', 'stop-color': to }));
          defs.appendChild(g);
          stroke = 'url(#' + gid + ')';
        }
        var p = el('path', {
          d: path(l), class: 'link', stroke: stroke,
          'stroke-width': Math.max(1, l.width), 'stroke-opacity': unknown ? 1 : null,
        });
        hover(p, l.source.label + ' → ' + l.target.label + ' · ' + fmt(l.value) + ' W');
        svg.appendChild(p);
      });

      graph.nodes.forEach(function (n) {
        var h = Math.max(1, n.y1 - n.y0);
        var color = n.depth === 0 ? css.getPropertyValue('--text-secondary').trim() : colorOf(n);
        var rect = el('rect', { x: n.x0, y: n.y0, width: n.x1 - n.x0, height: h, rx: 2, fill: color, class: 'node' });
        var pct = m.total ? Math.round(n.watts / m.total * 100) : 0;
        hover(rect, n.label + ' · ' + fmt(n.watts) + ' W · ' + pct + '%');
        svg.appendChild(rect);

        if (h < 9) return;
        var t = el('text', { x: n.x1 + 7, y: n.y0 + h / 2 + 3.5, class: 'lbl' + (colorOf(n) === neutral && n.depth > 0 ? ' dim' : '') });
        var v = el('tspan', { class: 'v' });
        v.textContent = fmt(n.watts) + ' W';
        t.appendChild(v);
        var nm = el('tspan', {});
        nm.textContent = '  ' + cut(n.label, 26);
        t.appendChild(nm);
        svg.appendChild(t);
      });
    }

    /**
     * ⚠️ Dans un WIDGET, `Homey.api` rend une PROMESSE — contrairement à une page de réglages, où
     * elle prend un rappel en quatrième argument. Passer un rappel ne produit aucune erreur : il
     * n'est simplement jamais appelé, et le widget reste vide.
     */
    function call(method, path) {
      var r;
      try { r = Homey.api(method, path, {}); }
      catch (e) { return Promise.reject(e); }
      if (r && typeof r.then === 'function') return r;
      return Promise.reject(new Error('Homey.api n’a pas rendu de promesse'));
    }

    function fail(message) {
      document.getElementById('hero').innerHTML = '—<span class="u">W</span>';
      document.getElementById('sub').textContent = String(message);
    }

    function load() {
      // `Homey.getSettings()` est SYNCHRONE dans un widget, contrairement à `Homey.api`.
      var grouping = 'category+zone';
      try {
        var st = Homey.getSettings() || {};
        if (typeof st.grouping === 'string' && st.grouping !== '') grouping = st.grouping;
      } catch (e) { /* réglage indisponible : la vue croisée fait un défaut acceptable */ }

      call('GET', '/?grouping=' + encodeURIComponent(grouping)).then(function (m) {
        if (!m) { fail('aucune donnée'); return; }
        var pct = m.total ? Math.round(m.unmeasured / m.total * 100) : 0;
        document.getElementById('hero').innerHTML = fmt(m.total) + '<span class="u">W</span>';
        document.getElementById('sub').innerHTML = m.partial
          ? 'somme des appareils — <b>aucun compteur général</b>'
          : '<b>' + fmt(m.measured) + ' W</b> identifiés · <b>' + fmt(m.unmeasured) + ' W</b> non mesurés (' + pct + '%)';
        render(m);
      }).catch(function (e) { fail((e && e.message) || e); });
    }

    // Un widget qui reste vide ne dit rien. S'il ne s'est rien passé, il doit le dire.
    setTimeout(function () {
      if (document.getElementById('sub').textContent === '') fail('pas de réponse de l’app');
    }, 4000);

    load();
    setInterval(load, 10000);
    window.addEventListener('resize', load);
    Homey.ready();
  }
</script>
