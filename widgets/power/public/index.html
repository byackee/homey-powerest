<!--
  Widget « Puissance estimée ».

  Une page de widget inclut /homey.js et attend onHomeyReady, comme une page de settings — ce
  n'est PAS une vue de pairing, où la seconde copie de l'API casserait tout silencieusement.
-->
<script type="text/javascript" src="/homey.js" data-origin="widget"></script>
<style>
  /* Les couleurs sont des JETONS, définis dans trois portées.
     La media query couvre le réglage du système ; les deux blocs `data-theme` couvrent le forçage
     du widget, qui doit l'emporter dans les DEUX sens — d'où le `:not([data-theme="light"])` qui
     laisse un forçage clair battre un système sombre. Sans cette structure, le réglage
     d'apparence n'avait rien à basculer : le widget n'ajustait que deux couleurs de texte et
     restait sur fond clair même forcé en sombre. */
  #w {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #8a8a8e;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) #w {
      color-scheme: dark;
      --surface-1: #1a1a19; --text-primary: #ffffff; --text-secondary: #98989f; --warn: #f0b357;
    }
  }
  :root[data-theme="dark"] #w {
    color-scheme: dark;
    --surface-1: #1a1a19; --text-primary: #ffffff; --text-secondary: #98989f; --warn: #f0b357;
  }

  html, body { margin: 0; padding: 0; }
  #w {
    background: var(--surface-1); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 12px 14px; box-sizing: border-box; height: 100%;
    display: flex; flex-direction: column; justify-content: center;
  }
  #w-name { font-size: 12px; color: var(--text-secondary); margin-bottom: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #w-power { font-size: 30px; font-weight: 650; line-height: 1.05; letter-spacing: -0.5px; }
  #w-power .u { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-left: 3px; }
  #w-sub { font-size: 11px; color: var(--text-secondary); margin-top: 4px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #w-warn { font-size: 11px; color: var(--warn); margin-top: 5px; line-height: 1.3; }
</style>

<div id="w">
  <div id="w-name">…</div>
  <div id="w-power">—<span class="u">W</span></div>
  <div id="w-sub"></div>
  <div id="w-warn"></div>
</div>

<script type="text/javascript">
  function onHomeyReady(Homey) {
    'use strict';

    var REFRESH_MS = 10000;

    function el(id) { return document.getElementById(id); }

    function render(data) {
      if (!data || !data.found) {
        el('w-name').textContent = 'Aucune estimation';
        el('w-power').innerHTML = '—<span class="u">W</span>';
        el('w-sub').textContent = 'Ajoutez cet appareil dans Power Estimator';
        el('w-warn').textContent = '';
        return;
      }
      el('w-name').textContent = data.name;
      var w = typeof data.watts === 'number' ? data.watts : null;
      el('w-power').innerHTML = (w === null ? '—' : (w < 10 ? w.toFixed(1) : Math.round(w)))
        + '<span class="u">W</span>';
      var kwh = typeof data.kwh === 'number' ? data.kwh.toFixed(2) + ' kWh' : '';
      el('w-sub').textContent = [kwh, data.profile].filter(Boolean).join(' · ');
      el('w-warn').textContent = data.doubleCounted
        ? 'Source non exclue de l’Énergie : elle y est comptée deux fois.'
        : '';
    }


    /**
     * Applique le thème choisi.
     *
     * `auto` s'en remet à `prefers-color-scheme`, qui est celui du SYSTÈME. Un widget n'a aucun
     * moyen de lire le thème de Homey lui-même : une Homey en mode sombre sur un téléphone en
     * mode clair donnerait donc un widget clair sur un tableau de bord sombre. D'où le forçage.
     */
    function applyTheme() {
      var mode = 'auto';
      try {
        var st = Homey.getSettings() || {};
        if (st.theme === 'light' || st.theme === 'dark') mode = st.theme;
      } catch (e) { /* réglage indisponible : auto reste un défaut acceptable */ }
      var root = document.documentElement;
      if (mode === 'auto') root.removeAttribute('data-theme');
      else root.setAttribute('data-theme', mode);
    }

    /**
     * ⚠️ `Homey.api` rend une PROMESSE dans un widget, un rappel dans une page de réglages. Le
     * rappel n'échoue pas : il n'est jamais appelé, et le widget reste vide sans un mot.
     * `Homey.getDeviceIds()`, lui, est bien synchrone.
     */
    function call(path) {
      var r;
      try { r = Homey.api('GET', path, {}); }
      catch (e) { return Promise.reject(e); }
      if (r && typeof r.then === 'function') return r;
      return Promise.reject(new Error('Homey.api n’a pas rendu de promesse'));
    }

    function load() {
      var ids = [];
      try { ids = Homey.getDeviceIds() || []; } catch (e) { ids = []; }
      if (!ids.length) { render(null); return; }
      call('/?sourceId=' + encodeURIComponent(ids[0])).then(render).catch(function (e) {
        el('w-name').textContent = 'Erreur';
        el('w-sub').textContent = (e && e.message) || String(e);
      });
    }

    applyTheme();
    load();
    setInterval(load, REFRESH_MS);
    Homey.ready();
  }
</script>
