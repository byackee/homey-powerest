<!--
  Vue de pairing unique.

  ⚠️ Aucune balise <script src="/homey.js"> ici : Homey injecte lui-même son API dans les vues de
  pairing. En charger une seconde copie crée une instance NON rattachée à la session — la page
  s'anime normalement, mais tous les Homey.emit() partent dans le vide, sans la moindre erreur.

  Toutes les vues d'un même driver partagent un document et la portée JS globale : les
  identifiants sont donc préfixés par le nom de la vue, et tout le script est encapsulé.
-->
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; }
  #ld-note { font-size: 12px; line-height: 1.45; background: #fff7e6; border: 1px solid #f0d9a8; border-radius: 8px; padding: 9px 11px; margin-bottom: 10px; }
  #ld-status { font-size: 13px; color: #666; margin-bottom: 10px; }
  #ld-list { list-style: none; margin: 0; padding: 0; }
  .ld-item { border: 1px solid #e3e3e3; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .ld-item.ld-off { opacity: .55; cursor: not-allowed; }
  .ld-name { font-weight: 600; font-size: 15px; }
  .ld-meta { font-size: 12px; color: #777; margin-top: 3px; }
  .ld-warn { font-size: 12px; color: #b45309; margin-top: 3px; }
  #ld-actions { margin-top: 12px; }
  button { font-size: 14px; padding: 8px 14px; border-radius: 6px; border: 1px solid #ccc; background: #fafafa; cursor: pointer; }
</style>

<div id="ld-note"></div>
<div id="ld-status">…</div>
<ul id="ld-list"></ul>
<div id="ld-actions"><button id="ld-refresh" type="button"></button></div>

<script type="text/javascript">
  (function () {
    'use strict';

    var POLL_MS = 2000;
    var busy = false;

    function trace(message) {
      try { Homey.emit('viewLog', String(message)); } catch (e) { /* la session peut être finie */ }
    }

    function el(id) { return document.getElementById(id); }

    /**
     * Traduction.
     *
     * `Homey.__` est injecté dans la vue de pairing comme le reste de l'API. Cette vue était
     * entièrement en français : un utilisateur néerlandais appairait ses appareils en lisant du
     * français. Le repli rend la clé — visible, donc corrigeable — plutôt qu'une chaîne vide.
     */
    function t(key) {
      try {
        var v = Homey.__(key);
        return (typeof v === 'string' && v !== '' && v !== key) ? v : key;
      } catch (e) { return key; }
    }

    function status(text) { el('ld-status').textContent = text; }

    var WARNINGS = {
      manual: 'pair.warn_manual', always_on: 'pair.warn_always_on',
      self_usage: 'pair.warn_self_usage', sub_profiles: 'pair.warn_sub_profiles',
      unconfirmed: 'pair.warn_unconfirmed',
    };

    function warningText(code) {
      return WARNINGS[code] ? t(WARNINGS[code]) : null;
    }

    function render(items) {
      var list = el('ld-list');
      list.innerHTML = '';
      var usable = 0;

      items.forEach(function (item) {
        var li = document.createElement('li');
        li.className = 'ld-item' + (item.selectable ? '' : ' ld-off');

        var name = document.createElement('div');
        name.className = 'ld-name';
        name.textContent = item.name + (item.zone ? ' — ' + item.zone : '');
        li.appendChild(name);

        var meta = document.createElement('div');
        meta.className = 'ld-meta';
        meta.textContent = item.profile
          ? item.profile + ' · ' + item.strategy + ' · ' + t('pair.via') + ' ' + item.detail
          : t('pair.no_profile_line');
        li.appendChild(meta);

        if (typeof item.homeyWatts === 'number' && item.homeyWatts > 0) {
          var h = document.createElement('div');
          h.className = 'ld-warn';
          h.textContent = t('pair.already_counted').replace('__watts__', String(item.homeyWatts));
          li.appendChild(h);
        }
        var warn = warningText(item.warning);
        if (warn) {
          var w = document.createElement('div');
          w.className = 'ld-warn';
          w.textContent = warn;
          li.appendChild(w);
        }

        if (item.selectable) {
          usable += 1;
          li.addEventListener('click', function () { pick(item); });
        }
        list.appendChild(li);
      });

      status(usable + ' ' + t('pair.estimable') + ' ' + items.length + ' ' + t('pair.without_meter'));
    }

    function pick(item) {
      if (busy) return;
      busy = true;
      status(t('pair.creating') + ' « ' + item.name + ' »…');
      Homey.emit('build', item.id, function (err, device) {
        if (err) {
          busy = false;
          status(t('pair.failed') + ' : ' + err);
          trace('build failed: ' + err);
          return;
        }
        Homey.createDevice(device, function (createErr) {
          if (createErr) {
            busy = false;
            status(t('pair.failed') + ' : ' + createErr);
            trace('createDevice failed: ' + createErr);
            return;
          }
          Homey.done();
        });
      });
    }

    function load() {
      Homey.emit('list', null, function (err, result) {
        if (err) { status(t('pair.error') + ' : ' + err); trace('list failed: ' + err); return; }
        if (!result.ready) {
          status(result.error
            ? t('pair.lib_unavailable') + ' : ' + result.error
            : t('pair.loading'));
          setTimeout(load, POLL_MS);
          return;
        }
        render(result.items);
      });
    }

    el('ld-refresh').addEventListener('click', function () {
      status(t('pair.loading'));
      Homey.emit('refresh', null, function () { load(); });
    });

    el('ld-note').innerHTML = t('pair.note');
    el('ld-refresh').textContent = t('pair.refresh');

    trace('list_devices ready');
    load();
  })();
</script>
